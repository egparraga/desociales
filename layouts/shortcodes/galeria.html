<style>
  .image-gallery {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    margin: 20px 0;
    list-style: none;
    padding: 0;
  }
  .gallery-item {
    width: calc(20% - 12px);
    box-sizing: border-box;
  }
  .gallery-item a {
    display: block;
    text-decoration: none;
  }
  .gallery-item img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    border-radius: 8px;
    transition: transform 0.2s ease;
  }
  .gallery-item img:hover {
    transform: scale(1.05);
  }

  @media (max-width: 768px) {
    .gallery-item { width: calc(33.33% - 10px); }
  }
  @media (max-width: 480px) {
    .gallery-item { width: calc(50% - 8px); }
  }
</style>

<ul class="image-gallery">
  {{ range .Page.Resources.ByType "image" }}
    <li class="gallery-item">
      {{ $thumb := .Fill "300x300 q75" }}
      {{ $original := .Fit "1600x1600 q80" }}

      <!-- Añadimos target="_blank" y rel="noopener noreferrer" aquí -->
      <a href="{{ $original.RelPermalink }}" target="_blank" rel="noopener noreferrer">
        <img src="{{ $thumb.RelPermalink }}" alt="{{ .Name }}" title="{{ .Name }}">
      </a>
    </li>
  {{ end }}
</ul>
